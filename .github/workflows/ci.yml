name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testler (birim + property-based + denetim motoru)
        run: npm test

      - name: Üretim derlemesi
        run: npm run build

      # Sertifikasyon regresyon kapısı: kalibre edilmiş RTP bantları
      # dışına çıkan her yapı değişikliği bu adımda düşer.
      # Deterministiktir: sabit (spins=2M, seed="rtp-gate-1") → sabit sonuç.
      - name: RTP kapısı (CI)
        run: npm run gate

      # Yerel denetim DB'si varsa (yerel çalıştırma kanıtı), replay denetimi
      - name: Denetçi replay (varsa DB)
        if: ${{ hashFiles('.data/slot.db') != '' }}
        run: npm run audit

      # Ortam postürü (Faz 7): dev ortamda bilgilendirici, kodla ölçüm
      - name: Ortam kontrolü (doctor)
        run: npm run doctor

      # WORM mekanizması (Faz 7): hash-zincirli dışa aktar + zinciri doğrula
      - name: Denetim dışa aktarımı + zincir doğrulama
        if: ${{ hashFiles('.data/slot.db') != '' }}
        run: |
          npm run audit:export
          f=$(ls -t .data/exports/*.jsonl | head -1)
          npm run audit:export -- --verify "$f"
